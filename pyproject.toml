[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "0.1.0"
description = "Distributed AI Coding Agent Fleet Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "psutil>=5.9",
    "pydantic>=2.0",
]

[project.scripts]
hive = "hivemind.cli:cli"
